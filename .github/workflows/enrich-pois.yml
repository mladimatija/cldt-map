name: Refresh trail POIs

# Runs the POI enricher (`npm run enrich-pois`) on the first of each month.
# When the run produces any change to public/pois.json the workflow opens (or
# updates) a pull request against master for human review.
#
# Required repository secret:
#   - NEXT_PUBLIC_GPX_URL   Trail GPX URL (same value as in .env.local)
#
# Optional repository variable:
#   - OSM_OVERPASS_URL      Alternative Overpass endpoint; defaults to the
#                           public https://overpass-api.de/api/interpreter.

permissions: read-all

on:
  schedule:
    # 1st of each month at 04:30 UTC. Staggered 30 min after the OSM tag
    # enrichment, so both don't hammer Overpass at the same minute.
    - cron: '30 4 1 * *'
  workflow_dispatch:

jobs:
  enrich:
    name: Enrich POIs and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run POI enricher
        env:
          NEXT_PUBLIC_GPX_URL: ${{ secrets.NEXT_PUBLIC_GPX_URL }}
          # Expected: https://overpass-api.de/api/interpreter or a self-hosted Overpass endpoint
          OSM_OVERPASS_URL: ${{ vars.OSM_OVERPASS_URL }}
        run: |
          [[ "$OSM_OVERPASS_URL" =~ ^https?:// ]] || [[ -z "$OSM_OVERPASS_URL" ]] || { echo "OSM_OVERPASS_URL must be http/https"; exit 1; }
          npm run enrich-pois

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'chore: refresh POI dataset'
          title: 'chore: refresh POI dataset'
          body: |
            Automated monthly refresh of `public/pois.json`.

            The enricher queried Overpass for `place=city|town|village`
            within the trail bbox + buffer, snapped each candidate to the
            nearest trail point, and filtered to <= 25 km off-trail. Prior
            manually-curated fields (`note_en`, `note_hr`, `url`, `tags`,
            custom localised names) are preserved on the merge step.

            Review the type breakdown in the workflow logs and the diff for
            unexpected additions or removals, then merge.

            The branch is reused month-over-month, so this PR will be
            updated on the next run if still open.
          branch: feat/refresh-pois
          delete-branch: true
          base: master
          labels: |
            poi-enrichment
            automated
