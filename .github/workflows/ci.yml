name: CI
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: i18n key parity
        run: npm run check:i18n

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Prebuild outputs
        run: |
          test -f public/sw-version.js || { echo "public/sw-version.js is missing: the npm prebuild hook did not run"; exit 1; }
          test -f public/data/pois/manifest.json || { echo "public/data/pois/manifest.json is missing: the npm prebuild hook did not run"; exit 1; }

      - name: Bundle size budget
        run: npm run check:bundle
