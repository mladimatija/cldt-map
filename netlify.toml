# Netlify configuration for Next.js
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  # npm run build, not next build: the npm prebuild hook writes the service
  # worker version stamp (public/sw-version.js) and the per-type POI split.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
